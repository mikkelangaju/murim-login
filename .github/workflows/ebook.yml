name: Publish ebook release

on:
  push:
    branches: [master]
    paths:
      - "translations/**"
      - "tools/build.py"
      - "tools/*.css"
      - "tools/epub-popup.js"
      - "tools/system-window.lua"
      - "tools/*.typ"
      - "tools/fonts/**"
      - "reader/src/ornaments/**"
      - "cover.jpg"
      - ".github/workflows/ebook.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ebook-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pandoc/actions/setup@v1
        with:
          version: "3.11"

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-noto-mono
          sudo fc-cache -f

      - name: Build PDF and both EPUB editions
        run: |
          python tools/build.py --format pdf
          python tools/build.py --format epub
          python tools/build.py --format epub --full-color-epub

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=ebook
          title="Murim Login"
          sha="${GITHUB_SHA:0:7}"
          chapters="$(find translations -maxdepth 1 -name '[0-9][0-9][0-9][0-9].md' | wc -l)"
          notes="$(printf 'PDF, simple Kindle EPUB (murim-login.epub), and full-color EPUB (murim-login-color.epub) from `%s` (%s chapters). This release is overwritten on every master build.' "$sha" "$chapters")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/murim-login.pdf build/murim-login.epub build/murim-login-color.epub --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" build/murim-login.pdf build/murim-login.epub build/murim-login-color.epub \
              --title "$title" --notes "$notes"
          fi
